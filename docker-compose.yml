version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: image-quality-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/quality.db
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: image-quality-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  backend-data:
