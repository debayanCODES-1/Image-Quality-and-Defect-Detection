version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: image-quality-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/quality.db
      - IMAGGA_API_KEY=${IMAGGA_API_KEY}
      - IMAGGA_API_SECRET=${IMAGGA_API_SECRET}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: image-quality-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
